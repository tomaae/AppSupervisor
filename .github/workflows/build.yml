name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore AppSupervisor.slnx --runtime win-x64

      - name: Test
        run: dotnet test AppSupervisor.slnx --configuration Release --no-restore
